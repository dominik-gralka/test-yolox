events {
    worker_connections 1024;
}

http {
    upstream yolox_backend {
        # Add multiple API instances for load balancing
        server yolox-api:8000;
        # server yolox-api-2:8000;
        # server yolox-api-3:8000;
    }

    server {
        listen 80;
        server_name _;

        # Increase timeouts for ML inference
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Increase max body size for image uploads
        client_max_body_size 10M;

        location / {
            proxy_pass http://yolox_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            access_log off;
            proxy_pass http://yolox_backend/api/v1/health;
        }
    }
}
